<polyline points="530,385 650,385" fill="none" stroke="#787878" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt" />
<polygon points="650,385 642,381 642,389" fill="#787878" />
<polyline points="800,420 800,509" fill="none" stroke="#787878" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt" />
<polygon points="800,509 804,501 796,501" fill="#787878" />
