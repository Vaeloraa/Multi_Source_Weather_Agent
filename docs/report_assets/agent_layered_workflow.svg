<text x="390.0" y="85.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#303030" text-anchor="middle" dominant-baseline="central">Submit question and data</text>
<rect x="1080" y="59" width="300" height="52" rx="3" fill="white" stroke="#A0A0A0" stroke-width="1.1" />
