<text x="390.0" y="235.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#303030" text-anchor="middle" dominant-baseline="central">Bind data and load context</text>
<rect x="250" y="359" width="280" height="52" rx="3" fill="white" stroke="#A0A0A0" stroke-width="1.1" />
<text x="390.0" y="385.0" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="400" fill="#303030" text-anchor="middle" dominant-baseline="central">Select tools and read instructions</text>
<rect x="650" y="350" width="300" height="70" rx="3" fill="white" stroke="#A0A0A0" stroke-width="1.1" />
