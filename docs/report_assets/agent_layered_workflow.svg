<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img">
<title>Multi-Source Weather Agent workflow</title><desc>Requests, execution, feedback and answers across the system layers.</desc>
<rect width="100%" height="100%" fill="white" />
<rect x="230" y="35" width="1175" height="100" rx="5" fill="#F8F8F8" stroke="#D8D8D8" stroke-width="1.1" />
<text x="200" y="85.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#303030" text-anchor="end" dominant-baseline="central">User interface</text>
