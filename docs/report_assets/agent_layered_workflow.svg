<polygon points="1080,385 1072,381 1072,389" fill="#787878" />
<text x="1015" y="361" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#707070" text-anchor="middle" dominant-baseline="central">Finish analysis</text>
<polyline points="1230,359 1230,111" fill="none" stroke="#787878" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt" />
<polygon points="1230,111 1226,119 1234,119" fill="#787878" />
<text x="1251" y="235" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#707070" text-anchor="start" dominant-baseline="central">Answer</text>
</svg>