<polygon points="765,659 769,651 761,651" fill="#787878" />
<polyline points="835,659 835,561" fill="none" stroke="#787878" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="butt" />
<polygon points="835,561 831,569 839,569" fill="#787878" />
<text x="744" y="608" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#707070" text-anchor="end" dominant-baseline="central">Call</text>
<text x="856" y="608" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#707070" text-anchor="start" dominant-baseline="central">Data / source text</text>
